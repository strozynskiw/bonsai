[[connections]]
id = "opencode"
display_name = "OpenCode Go"
auth = "api-key"
transport = "openai-chat"
default_base_url = "https://opencode.ai/zen/go/v1"
api_key_env = "OPENCODE_API_KEY"
model_env = "OPENCODE_MODEL"
base_url_env = "OPENCODE_BASE_URL"
default_model = "opencode/qwen3.7-max"
default_endpoint_path = "chat/completions"
default_token_counter = "qwen3"
# Zen gateway accepts `prompt_cache_key` and reports `prompt_tokens_details.cached_tokens`
# (verified live: ~95% on a warm prefix). Enable the OpenAI-family cache key.
prompt_cache = true
# IMPORTANT — DO NOT REMOVE OR GLOBALIZE: OpenCode's Anthropic-wire Qwen and
# MiniMax adapters must keep changing git/read-coverage state *after* stable
# history. Otherwise every read/tool result changes the system tail before the
# history breakpoint: live Qwen fell from 95% warm reuse to alternating
# 60–91%/0% turns. OpenAI-chat models (GLM, DeepSeek, etc.) already use this
# layout, so selecting it at the connection keeps their proven body unchanged.
# Other connections retain their transport default unless explicitly opted in.
prompt_cache_policy = "rolling-history"
# The Go gateway's DeepSeek adapter rejects any request whose assistant tool-call
# messages lack `reasoning_content` (HTTP 400 "Upstream request failed", naming
# neither the field nor the message). Bonsai usually escapes it by accident — the
# volatile-tail reshape appends a trailing user message, and the adapter only
# faults when a tool result is the final message — so it bites exactly the lanes
# with no volatile system tail to move. Verified live: harmless for this
# connection's qwen/GLM/MiniMax models.
reasoning_content_echo = true

[[connections]]
id = "opencode-zen"
display_name = "OpenCode Zen"
auth = "api-key"
transport = "openai-chat"
default_base_url = "https://opencode.ai/zen/v1"
api_key_env = "OPENCODE_API_KEY"
model_env = "OPENCODE_ZEN_MODEL"
base_url_env = "OPENCODE_ZEN_BASE_URL"
default_model = "opencode-zen/grok-code"
default_endpoint_path = "chat/completions"
default_token_counter = "tiktoken"
prompt_cache = true
# Zen's OpenAI- and Anthropic-upstream adapters (gpt-5.x, claude-opus-4-8) stream
# a complete answer and close without ever sending `finish_reason` or `[DONE]`;
# the last frames are `{"choices":[],"usage":{…}}` and a cost frame. Without this
# every one of those models failed the truncation guard with "stream ended before
# a terminal finish_reason". Zen's other families (GLM, DeepSeek, Kimi, Qwen,
# MiniMax) do send finish_reason and are unaffected.
usage_frame_ends_stream = true

