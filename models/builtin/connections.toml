[[connections]]
id = "deepseek"
display_name = "DeepSeek API"
auth = "api-key"
transport = "openai-chat"
default_base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
model_env = "DEEPSEEK_MODEL"
base_url_env = "DEEPSEEK_BASE_URL"
default_model = "deepseek/deepseek-v4-flash"
default_endpoint_path = "chat/completions"
default_token_counter = "tiktoken"
# DeepSeek does automatic, on-disk, strictly prefix-based context caching (a hit
# is ~50x cheaper than a miss), reported as prompt_cache_hit_tokens /
# prompt_cache_miss_tokens. Enable the OpenAI-family cache key + hit accounting.
prompt_cache = true
# Append-only project-state layout: store volatile state as immutable in-place
# snapshots so every prior request stays an EXACT prefix of the next — the
# condition DeepSeek's automatic cache requires to hit. Scoped to this connection
# only; every other connection leaves this unset (= TransportDefault) and is
# unaffected. See models/builtin/deepseek.toml.
prompt_cache_policy = "rolling-history"
# NOTE — deliberate divergence from the OpenCode gateway's DeepSeek adapter
# (see the `opencode` connection above): that gateway REQUIRES reasoning_content
# echoed back on assistant tool-call messages, but the DIRECT api.deepseek.com
# does not accept reasoning_content as input, so reasoning_content_echo is
# omitted (false) here. Do not copy the gateway's flag onto this connection.

[[connections]]
id = "qwencloud"
display_name = "Qwen Cloud API"
auth = "api-key"
transport = "openai-chat"
# Qwen Cloud (docs.qwencloud.com) pay-as-you-go serves through the DashScope
# international OpenAI-compatible endpoint. DASHSCOPE_API_KEY is the env var
# the official docs and the wider Qwen tooling ecosystem already use.
# Discovery is static because the DashScope /models listing includes
# embedding, speech, and subscription-tier models the user's API key cannot
# call — polluting the picker with inaccessible entries.
discovery = "static"
default_base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
model_env = "DASHSCOPE_MODEL"
base_url_env = "DASHSCOPE_BASE_URL"
default_model = "qwencloud/qwen3.7-plus"
default_endpoint_path = "chat/completions"
default_token_counter = "qwen3"
# Automatic server-side prefix caching, no explicit markers: verified live
# (qwen3.7-plus, ~6.9K-token prompt) — cold cached_tokens: 0, immediate warm
# repeat cached_tokens: 6272/6896 (~91%), reported in
# prompt_tokens_details.cached_tokens on both response and stream usage frames.
prompt_cache = true
# Append-only project state so every prior request stays an exact byte prefix
# of the next — the condition a strict-prefix automatic cache needs to hit
# (same rationale as `deepseek`; scoped to this connection only).
prompt_cache_policy = "rolling-history"
# NOTE: no reasoning_content_echo — verified live that a tool round WITHOUT
# reasoning_content on the assistant tool-call message succeeds against the
# direct endpoint (unlike the OpenCode gateway's Qwen adapter). Mid-stream
# system messages are also accepted (no strict-template 400).

[[connections]]
id = "qwencloud-token-plan"
display_name = "Qwen Cloud Token Plan"
auth = "api-key"
transport = "openai-chat"
# The Token Plan subscription (docs.qwencloud.com/token-plan) uses a fixed
# regional host and its OWN key type — Token Plan and pay-as-you-go keys are
# not interchangeable (docs: token-plan/migrate-from-coding-plan). Host shape
# verified live: a bad key returns a proper InvalidApiKey JSON error.
default_base_url = "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_TOKEN_PLAN_API_KEY"
model_env = "DASHSCOPE_TOKEN_PLAN_MODEL"
base_url_env = "DASHSCOPE_TOKEN_PLAN_BASE_URL"
default_model = "qwencloud-token-plan/qwen3.7-max"
default_endpoint_path = "chat/completions"
default_token_counter = "qwen3"
# Same DashScope serving stack as `qwencloud` above; cache verified there.
# Discovery is static — the Token Plan /models listing likely returns the
# same embedding/speech/subscription-tier pollution as the pay-as-you-go
# endpoint, polluting the picker with inaccessible entries.
discovery = "static"
prompt_cache = true
prompt_cache_policy = "rolling-history"

[[connections]]
id = "gemini"
display_name = "Google Gemini"
auth = "api-key"
transport = "openai-chat"
# Gemini's OpenAI-compatible layer. Bearer auth (not the native x-goog-api-key).
# No trailing slash — the transport appends `/chat/completions`.
default_base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
model_env = "GEMINI_MODEL"
base_url_env = "GEMINI_BASE_URL"
default_model = "gemini/gemini-3.1-pro-preview"
default_endpoint_path = "chat/completions"
default_token_counter = "heuristic"
# Gemini takes OpenAI's top-level `reasoning_effort` on this endpoint (see
# gemini.toml); it does NOT use the `reasoning: {effort}` envelope.
reasoning_codec = "openai-chat-completions"
# Gemini caches implicitly and automatically — there is NO client-sent routing
# key. Its OpenAI-compat layer also strictly rejects unknown request fields, so
# emitting `prompt_cache_key` (what `prompt_cache = true` sends on openai-chat)
# 400s with `Unknown name "prompt_cache_key": Cannot find field`. Leave
# prompt_cache OFF: the read side is unaffected — `chat_completions_usage_from_value`
# parses `prompt_tokens_details.cached_tokens` unconditionally — so Gemini's
# implicit cache reuse is still accounted without sending any key. See gemini.toml.
prompt_cache = false

