[[connections]]
id = "mimo"
display_name = "Xiaomi MiMo API"
auth = "api-key"
# MiMo exposes both an OpenAI- and an Anthropic-compatible endpoint, each
# accepting `Authorization: Bearer` or a bare `api-key` header. We use the
# OpenAI endpoint (MiMo's primary, best-documented format) via bonsai's
# openai-chat transport, which sends `Authorization: Bearer` — no `x-api-key`
# and no `anthropic-version`, both of which the Anthropic path added and which
# MiMo's gateway rejected with a 401.
transport = "openai-chat"
default_base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
model_env = "MIMO_MODEL"
base_url_env = "MIMO_BASE_URL"
default_model = "mimo/mimo-v2.5-pro"
default_endpoint_path = "chat/completions"
# A local heuristic counter avoids a remote token-count dependency.
default_token_counter = "heuristic"
# Prompt caching over MiMo's Anthropic endpoint is undocumented and unverified,
# so no `cache_control` breakpoints are sent (prompt_cache defaults off). Enable
# it here once a warm request is confirmed to return `cache_read_input_tokens`.

[[connections]]
id = "mimo-coding-plan"
display_name = "Xiaomi MiMo Coding Plan"
# The Token Plan gives each account its OWN dedicated base URL (region-specific,
# e.g. token-plan-ams / token-plan-cn), shown in the MiMo console. There is no
# universal host, so this connection uses endpoint setup: /authorize prompts for
# the dedicated base URL (or set MIMO_CODING_PLAN_BASE_URL) plus the tp- key.
# openai-chat sends `Authorization: Bearer`, which MiMo accepts (verified live).
auth = "optional-api-key"
transport = "openai-chat"
default_base_url = "https://token-plan-ams.xiaomimimo.com/v1"
api_key_env = "MIMO_CODING_PLAN_API_KEY"
model_env = "MIMO_CODING_PLAN_MODEL"
base_url_env = "MIMO_CODING_PLAN_BASE_URL"
default_model = "mimo-coding-plan/mimo-v2.5-pro"
default_endpoint_path = "chat/completions"
default_token_counter = "heuristic"

