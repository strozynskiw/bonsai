# xAI Grok direct API (https://api.x.ai/v1), OpenAI Chat Completions wire.
# Auth is `Authorization: Bearer <XAI_API_KEY>`.
#
# `/refresh` uses xAI's authenticated `/models` listing, then merges current
# models.dev metadata. Official xAI model and pricing pages remain authoritative
# where the aggregator differs.
#
# Prompt caching is automatic and strictly prefix-based. Chat Completions uses
# the stable `x-grok-conv-id` header for sticky routing; `prompt_cache_key` is a
# Responses API body field and must not be sent on this transport. The
# connection declares both the header and rolling history in connections.toml.
#
# Long-context pricing begins at 200,000 prompt tokens and reprices the entire
# request. Every short/full picker pair carries the same schedule, so billing
# selects rates from actual provider-reported usage. The picker row controls
# Bonsai's context/compaction budget, not which remote model id is sent.
#
# grok-4.5 and grok-build-0.1 have always-on reasoning with low/medium/high
# effort. grok-4.3 additionally supports `none`, represented by the toggle that
# the OpenAI Chat Completions reasoning codec maps to reasoning_effort="none".
#
# xAI documents function calling and image input for all shipped rows. It does
# not publish a separate maximum completion-token limit; the 30K cap matches
# the current 4.x listing and remains a conservative rumination guard.
#
# Re-evaluated exclusions (official docs checked 2026-07-28):
# not-shipped: grok-4.20-0309-reasoning — older than grok-4.3 with the same 1M limits and rates
# not-shipped: grok-4.20-0309-non-reasoning — grok-4.3 now provides reasoning_effort=none
# not-shipped: grok-4.20-multi-agent-0309 — no Chat Completions or client/custom tool support

[[targets]]
connection = "xai"
model = "xai/grok-build-0.1"
remote_model = "grok-build-0.1"
display_name = "Grok Build 0.1 · <200K context"
recommended = true
default = true
recommended_effort = "medium"
token_counter = "tiktoken"
reasoning_codec = "openai-chat-completions"
pinned_fields = ["display-name", "context-window", "output-limit", "pricing", "features", "reasoning"]
context_window = 199999
output_limit = 30000
features = ["tool-call", "reasoning", "structured-output", "attachment"]
pricing = { input_micros_per_million = 1000000, output_micros_per_million = 2000000, cache_read_micros_per_million = 200000 }
pricing_tiers = [{ minimum_input_tokens = 200000, pricing = { input_micros_per_million = 2000000, output_micros_per_million = 4000000, cache_read_micros_per_million = 400000 } }]

[[targets.reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

