# Tencent Hunyuan, OpenAI Chat Completions wire, Bearer auth (no TC3-HMAC signing
# on the OpenAI-compatible path). Auth is `Authorization: Bearer <HUNYUAN_API_KEY>`.
#
# ENDPOINT CHOICE — the default base URL is Tencent's TokenHub international host
# (https://tokenhub-intl.tencentmaas.com/v1), which is the verified international
# OpenAI-compatible surface that serves Hy3 (the model that motivates this
# connection; it is OpenRouter's #1 by usage). models.dev carries this as the
# `tencent-tokenhub` block, which serves ONLY hy3 and hy3-preview — so those are
# the only targets here (hunyuan-a13b-instruct / turbos / t1 live on the mainland
# first-party endpoint, not TokenHub, and would 404). Alternatives via
# HUNYUAN_BASE_URL:
#   - first-party (mainland account, real-name verified):
#     https://api.hunyuan.cloud.tencent.com/v1  (classic hunyuan-turbos/-t1 slugs)
#   - OpenRouter aggregator: model becomes `tencent/hy3` via the openrouter connection.
#
# PRICING — TokenHub's own per-token pricing is UNPUBLISHED (models.dev
# tencent-tokenhub lists $0 for hy3/hy3-preview). The rates below are estimates
# carried over from OpenRouter's `tencent/hy3` listing so cost accounting is not
# silently zero; VERIFY against a real TokenHub invoice/usage before trusting them.
#
# VERIFY LIVE before relying on this (all flagged uncertain at add time):
#   (a) the exact `hy3` slug on the chosen host, (b) whether responses report
#   cached tokens and under what usage field (prompt_cache is therefore left OFF),
#   (c) whether reasoning_content is echoed / streaming finish_reason behavior,
#   (d) the pricing above.
#
# Reasoning: Hy3 is a hybrid model whose depth rides a NON-standard
# `reasoning_effort` with values no_think (default) / low / high — which does not
# match bonsai's openai-chat-completions codec (none/low/medium/high). So no
# reasoning options are exposed: Hy3 runs in its no_think default. Add a
# dedicated hunyuan codec (no_think/low/high) to expose the thinking modes.

[[targets]]
connection = "tencent"
model = "tencent/hy3"
remote_model = "hy3"
metadata_model = "tencent-tokenhub/hy3"
recommended = true
default = true
token_counter = "heuristic"
pinned = true
context_window = 256000
output_limit = 32000
pricing = { input_micros_per_million = 140000, output_micros_per_million = 580000 }

[[targets]]
connection = "tencent"
model = "tencent/hy3-preview"
remote_model = "hy3-preview"
metadata_model = "tencent-tokenhub/hy3-preview"
roles = ["cheap"]
token_counter = "heuristic"
pinned = true
context_window = 256000
output_limit = 32000
pricing = { input_micros_per_million = 63000, output_micros_per_million = 210000 }
