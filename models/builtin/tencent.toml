# Tencent TokenHub, OpenAI Chat Completions wire, Bearer auth. `/refresh` reads
# the authenticated TokenHub `/models` catalog, filters offline/non-Hunyuan
# products, then models.dev enriches newly served Hunyuan ids where available.
#
# Hy3's current official specification is text-only, 256K context, up to 192K
# input and 128K output. Its exact reasoning values are no_think/low/high.
# TokenHub preserved thinking requires reasoning_content replay on every
# assistant turn, and its prompt cache uses both prompt_cache_key and
# X-Session-ID. The transport implements those connection-level contracts.
#
# The official international price list (updated 2026-07-20) publishes USD
# rates of $0.132/M input, $0.528/M output, and $0.033/M cached input. TokenHub
# does not expose prices in `/models`, so these official rates stay pinned while
# `/refresh` updates availability and other model metadata.

[[targets]]
connection = "tencent"
model = "tencent/hy3"
remote_model = "hy3"
metadata_model = "tencent-tokenhub/hy3"
display_name = "Hy3"
recommended = true
default = true
recommended_effort = "high"
token_counter = "heuristic"
pinned_fields = ["display-name", "context-window", "output-limit", "pricing", "features", "reasoning"]
context_window = 256000
output_limit = 128000
features = ["tool-call", "reasoning", "structured-output", "temperature"]
pricing = { input_micros_per_million = 132000, output_micros_per_million = 528000, cache_read_micros_per_million = 33000 }

[[targets.reasoning_options]]
type = "effort"
values = ["none", "low", "high"]

# Preview remains a distinct TokenHub model id. Tencent publishes the same
# 256K/128K limits, but its current international price sheet has no standalone
# Preview rate. Leave pricing unknown instead of inheriting models.dev's zero
# placeholders or carrying an obsolete third-party estimate.
[[targets]]
connection = "tencent"
model = "tencent/hy3-preview"
remote_model = "hy3-preview"
display_name = "Hy3 Preview"
recommended_effort = "high"
token_counter = "heuristic"
pinned_fields = ["display-name", "context-window", "output-limit", "features", "reasoning"]
context_window = 256000
output_limit = 128000
features = ["tool-call", "reasoning", "structured-output", "temperature"]

[[targets.reasoning_options]]
type = "effort"
values = ["none", "low", "high"]
