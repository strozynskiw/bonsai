# Google Gemini through the documented OpenAI-compatible Chat Completions
# endpoint. `/refresh` uses Google's richer native Models API for availability
# and limits, then merges Models.dev metadata in Rust.
#
# Gemini 3 tool calls return an encrypted thought signature in
# `tool_calls[].extra_content`. The transport preserves that exact object on
# the corresponding assistant tool-call message, as required by Google.
#
# Pro requests crossing 200K input tokens reprice the entire request. Both the
# price-safe and explicit 1M picker rows retain the same complete pricing
# schedule; accounting selects the rate from actual provider-reported usage.
# The row only controls Bonsai's context/compaction budget.

# Gemini 3.1 Pro Custom Tools is Google's coding-agent/tool-use variant.
[[targets]]
connection = "gemini"
model = "gemini/gemini-3.1-pro-preview-customtools"
remote_model = "gemini-3.1-pro-preview-customtools"
metadata_model = "google/gemini-3.1-pro-preview-customtools"
recommended = true
default = true
recommended_effort = "high"
token_counter = "heuristic"
reasoning_codec = "openai-chat-completions"
pinned_fields = ["context-window", "output-limit", "pricing", "features", "reasoning"]
context_window = 200000
output_limit = 65536
features = ["tool-call", "reasoning", "structured-output", "attachment"]
pricing = { input_micros_per_million = 2000000, output_micros_per_million = 12000000, cache_read_micros_per_million = 200000 }
pricing_tiers = [{ minimum_input_tokens = 200001, pricing = { input_micros_per_million = 4000000, output_micros_per_million = 18000000, cache_read_micros_per_million = 400000 } }]

[[targets.reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]

