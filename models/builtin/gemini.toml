# Cheapest modern entry (2026-05): flat-priced, so it keeps the full 1M window.
# Confirmed served (live /models cache lists it); pricing verified against
# ai.google.dev/gemini-api/docs/pricing 2026-07-19 ($0.25/$1.50, cached $0.025).
# The "cheap" role stays on gemini-2.5-flash: a full flash beats a -lite tier
# for delegated coding work until proven otherwise.
[[targets]]
connection = "gemini"
model = "gemini/gemini-3.1-flash-lite"
remote_model = "gemini-3.1-flash-lite"
metadata_model = "google/gemini-3.1-flash-lite"
recommended_effort = "medium"
token_counter = "heuristic"
reasoning_codec = "openai-chat-completions"
pinned = true
context_window = 1048576
output_limit = 32000
pricing = { input_micros_per_million = 250000, output_micros_per_million = 1500000, cache_read_micros_per_million = 25000 }

[[targets.reasoning_options]]
type = "toggle"

[[targets.reasoning_options]]
type = "effort"
values = ["low", "medium", "high"]
