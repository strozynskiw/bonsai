# DeepSeek direct API (https://api.deepseek.com), OpenAI Chat Completions wire.
#
# `/refresh` combines the authenticated `/models` response (current account
# availability) with the Models.dev `deepseek` rows (prices, limits, and
# capabilities). The values below are offline fallbacks. The deliberate 32K
# output safety cap, two effective reasoning levels, and time-dependent prices
# are pinned; models.dev cannot represent recurring peak windows.
#
# Context caching is automatic, on-disk, and strictly prefix-based: a request
# hits the cache only when it fully matches a cached prefix unit (docs:
# guides/kv_cache). A hit is ~30x cheaper than a miss, reported per response as
# prompt_cache_hit_tokens / prompt_cache_miss_tokens. The `deepseek` connection
# selects prompt_cache_policy = "rolling-history" so bonsai stores volatile
# project state as immutable append-only history — every prior request stays an
# exact prefix of the next, which is exactly the condition DeepSeek's cache
# needs to hit. Verified live (deepseek-v4-flash, 4-turn read/write task): 65%
# input cache reuse, reported via prompt_cache_hit_tokens.
#
# Reasoning: v4 has a thinking mode toggled per request. Curl-verified against
# api.deepseek.com — it accepts `thinking: {type: enabled|disabled}` AND
# `reasoning_effort: <low|medium|high|max>`, including both together (unlike GLM
# 5.2), with the chain-of-thought returned in `reasoning_content`. That wire
# shape is exactly what bonsai's `zai-thinking` codec emits (toggle + effort
# together), so reuse it rather than add a duplicate DeepSeek-specific codec.
# The API documents `high` and `max` as the effective levels. `low` and
# `medium` are compatibility aliases for `high`, while `xhigh` aliases `max`,
# so only the two distinct choices are offered. reasoning_content IS echoed
# back on assistant tool-call messages (the direct API requires it; plain
# assistant messages accept-but-ignore it — see the connection's
# reasoning_content_echo flag). Legacy deepseek-chat / deepseek-reasoner were
# retired 2026-07-24 in favor of these v4 names.

[[targets]]
connection = "deepseek"
model = "deepseek/deepseek-v4-flash"
remote_model = "deepseek-v4-flash"
recommended = true
default = true
recommended_effort = "high"
token_counter = "tiktoken"
reasoning_codec = "zai-thinking"
context_window = 1000000
# The models advertise 384K output, but output_limit is the wire `max_tokens`
# and the rumination containment lever (same pattern as glm-5.2's 12000): with
# thinking enabled an uncapped turn can burn the entire allowance on
# chain-of-thought. 32000 matches the reference-agent output clamp and still
# leaves room for thinking plus a large diff. The field pin keeps Models.dev's
# 384K maximum from clobbering the deliberate cap while leaving capabilities
# refreshable.
pinned_fields = ["output-limit", "pricing", "reasoning"]
output_limit = 32000
features = ["tool-call", "reasoning", "structured-output"]
# Native off-peak and peak pay-as-you-go pricing (docs: quick_start/pricing),
# effective 2026-08-16 16:00 UTC. Automatic caching has no separate write
# charge, so no cache_write_micros is set. The recurring UTC windows live on
# the connection because both V4 models share them.
pricing = { input_micros_per_million = 220000, output_micros_per_million = 660000, cache_read_micros_per_million = 7000 }
peak_pricing = { input_micros_per_million = 440000, output_micros_per_million = 1320000, cache_read_micros_per_million = 14000 }

# Toggle thinking on/off (off = cheapest non-thinking flash) or dial the effort.
[[targets.reasoning_options]]
type = "toggle"

[[targets.reasoning_options]]
type = "effort"
values = ["high", "max"]

[[targets]]
connection = "deepseek"
model = "deepseek/deepseek-v4-pro"
remote_model = "deepseek-v4-pro"
token_counter = "tiktoken"
reasoning_codec = "zai-thinking"
context_window = 1000000
recommended_effort = "high"
# Same deliberate 32K max_tokens cap as flash — see the comment there.
pinned_fields = ["output-limit", "pricing", "reasoning"]
output_limit = 32000
features = ["tool-call", "reasoning", "structured-output"]
pricing = { input_micros_per_million = 660000, output_micros_per_million = 1980000, cache_read_micros_per_million = 22000 }
peak_pricing = { input_micros_per_million = 1320000, output_micros_per_million = 3960000, cache_read_micros_per_million = 44000 }

[[targets.reasoning_options]]
type = "toggle"

[[targets.reasoning_options]]
type = "effort"
values = ["high", "max"]
