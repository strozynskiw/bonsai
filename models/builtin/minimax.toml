max_tokens = 16000
context_window = 204800
output_limit = 131072
pricing = { input_micros_per_million = 600000, output_micros_per_million = 2400000, cache_read_micros_per_million = 60000, cache_write_micros_per_million = 375000 }
reasoning_options = []

