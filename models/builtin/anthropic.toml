[[targets.reasoning_options]]
type = "effort"
values = ["none", "low", "medium", "high", "xhigh", "max"]

[[targets]]
connection = "anthropic"
model = "anthropic/claude-fable-5"
remote_model = "claude-fable-5"
endpoint_path = "v1/messages"
token_counter = "anthropic-count-tokens"
reasoning_codec = "anthropic-adaptive"
max_tokens = 16000
context_window = 1000000
output_limit = 128000

[[targets.reasoning_options]]
type = "effort"
# No "none": thinking is always on for fable-5 and an explicit
# `{"type": "disabled"}` returns HTTP 400, so Off must not be offered.
values = ["low", "medium", "high", "xhigh", "max"]
