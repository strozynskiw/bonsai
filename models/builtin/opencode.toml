[[targets]]
connection = "opencode"
model = "opencode/qwen3.7-max"
metadata_model = "opencode-go/qwen3.7-max"
remote_model = "qwen3.7-max"
recommended = true
default = true
recommended_effort = "default"
discouraged_efforts = ["on"]
transport = "anthropic-messages"
endpoint_path = "messages"
token_counter = "qwen3"
context_window = 1000000
output_limit = 65536
pricing = { input_micros_per_million = 2500000, output_micros_per_million = 7500000, cache_read_micros_per_million = 500000, cache_write_micros_per_million = 3125000 }

[[targets.reasoning_options]]
type = "toggle"

[[targets]]
connection = "opencode"
model = "opencode/glm-5.2"
metadata_model = "opencode-go/glm-5.2"
remote_model = "glm-5.2"
transport = "openai-chat"
endpoint_path = "chat/completions"
token_counter = "tiktoken"
# GLM 5.2 rejects `thinking` + `reasoning_effort` together ("cannot specify
# both"); this codec sends only `reasoning_effort` for effort levels.
reasoning_codec = "zai-reasoning-effort"
recommended_effort = "off"
discouraged_efforts = ["default", "high", "xhigh", "max"]
context_window = 1000000
# Deliberately 12k, not the model's 131k ceiling. The OpenCode reference client
# clamps every request to 32k, but live Bonsai evals show GLM can spend that
# entire allowance on reasoning without acting. GLM ruminates:
# session 262 spent 71k completion tokens on a single thinking turn and the
# stream died before any action; the task_todo gate later spent exactly 32,768
# tokens on another empty turn. A bounded turn ends in a clean
# finish_reason=length, which the run loop retries at lower effort or answers
# with an act-now nudge instead of waiting through an unbounded marathon.
pinned = true
output_limit = 12000
pricing = { input_micros_per_million = 1400000, output_micros_per_million = 4400000, cache_read_micros_per_million = 260000 }

[[targets.reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

[[targets]]
connection = "opencode"
model = "opencode/minimax-m3"
metadata_model = "opencode-go/minimax-m3"
remote_model = "minimax-m3"
transport = "anthropic-messages"
endpoint_path = "messages"
token_counter = "anthropic-count-tokens"
# MiniMax M3 prices double above 512K context (models.dev tier boundary).
# Bonsai's pricing model is flat, so cap the working window at the boundary
# and bill at the base tier — the full 1M window would silently 2x costs.
pinned = true
context_window = 512000
output_limit = 131072
pricing = { input_micros_per_million = 300000, output_micros_per_million = 1200000, cache_read_micros_per_million = 60000 }

[[targets.reasoning_options]]
type = "toggle"

[[targets]]
connection = "opencode"
model = "opencode/deepseek-v4-flash"
metadata_model = "opencode-go/deepseek-v4-flash"
remote_model = "deepseek-v4-flash"
roles = ["cheap"]
transport = "openai-chat"
endpoint_path = "chat/completions"
token_counter = "tiktoken"
context_window = 1000000
# A sane per-turn bound on another thinking-heavy chat-completions model; the
# OpenCode reference client clamps all models to 32k output.
pinned = true
output_limit = 32768
recommended_effort = "default"
discouraged_efforts = ["high", "max"]
pricing = { input_micros_per_million = 140000, output_micros_per_million = 280000, cache_read_micros_per_million = 2800 }

[[targets.reasoning_options]]
type = "effort"
values = ["high", "max"]

