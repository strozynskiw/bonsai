# OpenCode Go lineup verified against the public /models listing and
# https://opencode.ai/docs/go/ on 2026-11-05. Lean rows backfill gateway-specific
# prices and limits from models.dev's opencode-go block.
# Retired routes are omitted; persisted custom model ids remain loadable.
# not-shipped: hy3-preview — retired preview; the current listing serves hy3
# Responses-only routes need a general Responses transport, not Codex auth.
# not-shipped: grok-4.7 — requires the gateway Responses transport
# not-shipped: muse-spark-1.2-contributor — requires the gateway Responses transport
# not-shipped: muse-spark-1.3-contributor — requires the gateway Responses transport
# not-shipped: gpt-5.6-luna — requires the gateway Responses transport
# not-shipped: gpt-6-luna — requires the gateway Responses transport
# not-shipped: gemini-4-argon — requires the gateway native GenerateContent transport

[[targets]]
connection = "opencode"
model = "opencode/qwen3.8-max"
metadata_model = "opencode-go/qwen3.8-max"
remote_model = "qwen3.8-max"
recommended = true
default = true
recommended_effort = "default"
display_name = "Qwen3.8 Max"
context_window = 1000000
output_limit = 131072
features = ["tool-call", "reasoning", "attachment", "structured-output", "temperature"]
pricing = { input_micros_per_million = 2000000, output_micros_per_million = 6000000, cache_read_micros_per_million = 250000, cache_write_micros_per_million = 2500000 }
transport = "anthropic-messages"
endpoint_path = "messages"
token_counter = "qwen3"

[[targets.reasoning_options]]
type = "toggle"

[[targets]]
connection = "opencode"
model = "opencode/beam-free"
metadata_model = "opencode-go/beam-free"
remote_model = "beam-free"
token_counter = "tiktoken"
reasoning_codec = "openai-chat-completions"

[[targets.reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

