# Codex's authenticated `/models` response is the authority for which remote
# slugs are currently usable and for provider-specific capabilities (reasoning
# efforts, working windows, vision, tool calls, Responses Lite). These entries
# are offline fallbacks and stable canonical IDs; `/refresh` overlays the live
# response and current models.dev `openai` prices.
#
# The backend currently advertises a 272K working window for every listed model.
# GPT-5.4 also reports a 1M maximum, but not a distinct remote model. Keep the
# working-window cap so flat per-target cost accounting never silently applies
# low-context prices to a long-context request.

[[targets]]
connection = "codex"
model = "openai/gpt-5.6-sol"
remote_model = "gpt-5.6-sol"
recommended = true
default = true
recommended_effort = "medium"
endpoint_path = "responses"
token_counter = "tiktoken"
pinned_fields = ["context-window"]
context_window = 272000
output_limit = 128000
pricing = { input_micros_per_million = 5000000, output_micros_per_million = 30000000, cache_read_micros_per_million = 500000, cache_write_micros_per_million = 6250000 }

[[targets.reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max", "ultra"]

