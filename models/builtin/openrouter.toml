# OpenRouter remote model slugs include the upstream provider prefix
# (`openai/gpt-5.2`). Bonsai model ids allow one slash, so expose a
# connection-local id and send the documented OpenRouter slug on the wire.
[[targets]]
connection = "openrouter"
model = "openrouter/gpt-5.2"
metadata_model = "openai/gpt-5.2"
remote_model = "openai/gpt-5.2"
default = true
recommended = true
token_counter = "tiktoken"

# IMPORTANT — DO NOT GENERALIZE: OpenRouter requires an explicit top-level
# cache_control for Anthropic models; sending it to every routed model changes
# provider eligibility and can be rejected. This model policy also emits a
# stable session_id and append-only project state so automatic breakpoints grow
# through tool history. Verified live against Claude Haiku 4.5.
[[targets]]
connection = "openrouter"
model = "openrouter/claude-haiku-4.5"
metadata_model = "anthropic/claude-haiku-4-5"
remote_model = "anthropic/claude-haiku-4.5"
prompt_cache_policy = "open-router-anthropic"
token_counter = "anthropic-count-tokens"
