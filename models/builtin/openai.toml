# OpenAI's `/v1/models` endpoint supplies account-specific model ids but no
# limits, prices, capabilities, or lifecycle metadata. `/refresh` therefore
# merges that live availability with Models.dev in Rust. These targets are the
# offline baseline for the current Chat Completions coding lineup.
#
# GPT-5.6 Sol/Terra/Luna, GPT-5.5, and GPT-5.4 have a 1.05M context window, but
# prompts above 272K input tokens reprice the entire request. Keep a price-safe
# 272K target and an explicit `-1m` target for each model. Models.dev context
# tiers refresh both prices independently; the bundled prices remain fallbacks.

[[targets]]
connection = "openai"
model = "openai/gpt-5.6-sol"
remote_model = "gpt-5.6-sol"
aliases = ["openai/gpt-5.6", "gpt-5.6"]
recommended = true
default = true
recommended_effort = "medium"
token_counter = "tiktoken"
pinned_fields = ["context-window"]
context_window = 272000
output_limit = 128000
features = ["tool-call", "reasoning", "structured-output", "attachment"]
pricing = { input_micros_per_million = 5000000, output_micros_per_million = 30000000, cache_read_micros_per_million = 500000, cache_write_micros_per_million = 6250000 }
pricing_tiers = [{ minimum_input_tokens = 272001, pricing = { input_micros_per_million = 10000000, output_micros_per_million = 45000000, cache_read_micros_per_million = 1000000, cache_write_micros_per_million = 12500000 } }]

[[targets.reasoning_options]]
type = "toggle"

[[targets.reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

[[targets]]
connection = "openai"
