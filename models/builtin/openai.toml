# The public OpenAI API supports a 1.05M context window, but requests above the
# long-context threshold use a higher pricing tier. Keep the default working
# window at 200K so Bonsai's flat per-target accounting stays exact; the
# explicit `-1m` target opts into the full window and its long-context rates.
[[targets]]
connection = "openai"
model = "openai/gpt-5.6"
remote_model = "gpt-5.6"
recommended = true
default = true
recommended_effort = "medium"
token_counter = "tiktoken"
pinned = true
context_window = 200000
output_limit = 128000
pricing = { input_micros_per_million = 5000000, output_micros_per_million = 30000000, cache_read_micros_per_million = 500000, cache_write_micros_per_million = 6250000 }

[[targets.reasoning_options]]
type = "toggle"

[[targets.reasoning_options]]
type = "effort"
values = ["low", "medium", "high", "xhigh", "max"]

