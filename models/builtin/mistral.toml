# Mistral AI La Plateforme (https://api.mistral.ai/v1), using the documented
# Chat Completions wire with bearer authentication.
#
# The current generalist lineup is Mistral Medium 3.5, Mistral Small 4,
# Mistral Large 3, and the Ministral 3 family. All six support function calls,
# structured output, and image input. Medium 3.5 and Small 4 are hybrid
# reasoning models with the official none/high effort choices; their streamed
# thinking blocks are parsed and replayed by the `mistral-chat-completions`
# codec selected on the connection.
#
# Cached prompt input is billed at 10% of normal input. Every row therefore
# includes the official cache-read rate, while connections.toml enables the
# stable cache key and append-only history needed for prefix reuse.
#
# The 32K completion cap is Bonsai's conservative agent-output containment
# limit; Mistral's model cards publish the context capacity, not a smaller
# completion limit. Official model cards and pricing were rechecked 2026-07-28.
#
# Deprecated Devstral and Magistral generations are intentionally absent.
# `/refresh` uses Mistral's native model cards and rejects archived models,
# non-chat products, and models without function calling before enrichment.

[[targets]]
connection = "mistral"
model = "mistral/mistral-medium-latest"
remote_model = "mistral-medium-latest"
display_name = "Mistral Medium 3.5"
recommended = true
default = true
recommended_effort = "high"
token_counter = "tiktoken"
pinned_fields = ["display-name", "context-window", "output-limit", "pricing", "features", "reasoning"]
context_window = 262144
output_limit = 32000
features = ["tool-call", "reasoning", "structured-output", "attachment"]
pricing = { input_micros_per_million = 1500000, output_micros_per_million = 7500000, cache_read_micros_per_million = 150000 }

[[targets.reasoning_options]]
type = "effort"
values = ["none", "high"]

