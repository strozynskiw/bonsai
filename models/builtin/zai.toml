[[targets]]
connection = "zai"
model = "zai/glm-5.2"
remote_model = "glm-5.2"
recommended = true
default = true
token_counter = "tiktoken"
reasoning_codec = "zai-reasoning-effort"
recommended_effort = "off"
discouraged_efforts = ["default", "high", "xhigh", "max"]
context_window = 1000000
# Match the bounded GLM 5.2 turns already proven on OpenCode: the full 131K
# allowance can otherwise be consumed entirely by reasoning before any action.
pinned = true
output_limit = 12000
pricing = { input_micros_per_million = 1400000, output_micros_per_million = 4400000, cache_read_micros_per_million = 260000, cache_write_micros_per_million = 0 }

[[targets.reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

