[[targets]]
connection = "zai"
model = "zai/glm-5.3"
remote_model = "glm-5.3"
token_counter = "zai-tokenizer"
reasoning_codec = "zai-thinking"
recommended_effort = "max"
# Z.AI's compatibility labels map minimal -> disabled thinking and
# medium/xhigh -> high/max; GLM-5.3 keeps low as a native effort.
discouraged_efforts = ["minimal", "medium", "xhigh"]
context_window = 1000000
# Rumination clamp shared with GLM-5.2: the full 131K output allowance can
# otherwise be consumed entirely by reasoning before any action (session 262:
# a 71k-token thinking turn with zero actions).
pinned = true
output_limit = 12000
pricing = { input_micros_per_million = 1400000, output_micros_per_million = 4400000, cache_read_micros_per_million = 260000, cache_write_micros_per_million = 0 }

[[targets.reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high", "xhigh", "max"]

