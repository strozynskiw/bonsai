[[targets]]
connection = "kimi-coding-plan"
model = "kimi-coding-plan/kimi-for-coding"
# The subscription alias is documented by Kimi Code; its models.dev row now
# tracks the newest K3 window (1M) while the active route keeps the K2.7
# limits, so keep the conservative window and zero pricing pinned until a live
# /models refresh proves the alias moved — an oversized window 400s, a small
# one only compacts early.
pinned = true
metadata_model = "kimi-code-plan-global/kimi-for-coding"
remote_model = "kimi-for-coding"
recommended = true
default = true
token_counter = "tiktoken"
context_window = 262144
output_limit = 32768
pricing = { input_micros_per_million = 0, output_micros_per_million = 0, cache_read_micros_per_million = 0, cache_write_micros_per_million = 0 }
reasoning_options = []

[[targets]]
connection = "kimi-coding-plan"
model = "kimi-coding-plan/kimi-for-coding-highspeed"
# The high-speed route serves the same K2.7 model under a distinct wire id and
# models.dev carries a matching row, so no pin is needed.
metadata_model = "kimi-code-plan-global/kimi-for-coding-highspeed"
remote_model = "kimi-for-coding-highspeed"
token_counter = "tiktoken"
context_window = 262144
output_limit = 32768
pricing = { input_micros_per_million = 0, output_micros_per_million = 0, cache_read_micros_per_million = 0, cache_write_micros_per_million = 0 }
reasoning_options = []
