# Xiaomi MiMo pay-as-you-go API (sk-... keys). models.dev lists MiMo under its
# `xiaomi` block — metadata_model maps each target there so pricing and window
# metadata backfill automatically. Reasoning is left off for now — MiMo's
# OpenAI-wire `thinking` param is unverified against bonsai's codec — so the
# explicit empty reasoning_options is deliberate, not missing data.

[[targets]]
connection = "mimo"
model = "mimo/mimo-v2.5-pro"
remote_model = "mimo-v2.5-pro"
metadata_model = "xiaomi/mimo-v2.5-pro"
recommended = true
default = true
endpoint_path = "chat/completions"
token_counter = "heuristic"
max_tokens = 16000
context_window = 1048576
output_limit = 131072
reasoning_options = []

# The base mimo-v2.5 shares the pro model's specs (1M context, 128K output,
# tool calling, Deep Thinking); offered as the cheaper general model.
[[targets]]
connection = "mimo"
model = "mimo/mimo-v2.5"
remote_model = "mimo-v2.5"
metadata_model = "xiaomi/mimo-v2.5"
roles = ["cheap"]
endpoint_path = "chat/completions"
token_counter = "heuristic"
max_tokens = 16000
context_window = 1048576
output_limit = 131072
reasoning_options = []
