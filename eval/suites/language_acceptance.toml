arguments = '{"path":"calc/calc.go"}'
[[tasks.mock.tool_turns.calls]]
name = "read"
arguments = '{"path":"calc/calc_test.go"}'
[[tasks.mock.tool_turns]]
[[tasks.mock.tool_turns.calls]]
name = "write"
arguments = '''{"path":"calc/calc.go","content":"package calc\n\nfunc Total(values []int) int {\n\ttotal := 0\n\tfor _, value := range values {\n\t\ttotal += value\n\t}\n\treturn total\n}\n"}'''
[[tasks.mock.tool_turns]]
[[tasks.mock.tool_turns.calls]]
name = "bash"
arguments = '{"command":"go test ./..."}'

[[tasks.graders]]
