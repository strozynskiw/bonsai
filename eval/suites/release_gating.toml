id = "release_gating"
seed = 103

[budgets]
max_logical_turns = 12
max_provider_attempts = 12
max_duration_ms = 5000

[[tasks]]
id = "malformed_tool_arguments_recover"
fixture = "fixtures/tiny_project"
prompt = "Recover from a malformed tool call, then add a release-gate note to README.md."

[tasks.mock]
final_response = "Recovered from malformed arguments and updated README.md."
[[tasks.mock.tool_turns]]
[[tasks.mock.tool_turns.calls]]
name = "read"
arguments = '{"path":"README.md"'
[[tasks.mock.tool_turns]]
[[tasks.mock.tool_turns.calls]]
name = "read"
arguments = '{"path":"README.md"}'
[[tasks.mock.tool_turns]]
[[tasks.mock.tool_turns.calls]]
name = "write"
arguments = '''{"path":"README.md","content":"# Tiny Project\n\nrelease-gating eval: malformed arguments recovered\n"}'''

[[tasks.graders]]
type = "file-state"
path = "README.md"
contains = ["malformed arguments recovered"]

[[tasks]]
id = "parallel_nonconflicting_writes"
fixture = "fixtures/tiny_project"
prompt = "Create two independent release-gate marker files in one tool turn."

[tasks.mock]
final_response = "Created both release-gate markers."
[[tasks.mock.tool_turns]]
[[tasks.mock.tool_turns.calls]]
id = "parallel-a"
name = "write"
arguments = '''{"path":"release/a.txt","content":"alpha\n"}'''
[[tasks.mock.tool_turns.calls]]
id = "parallel-b"
name = "write"
arguments = '''{"path":"release/b.txt","content":"beta\n"}'''

[[tasks.graders]]
type = "file-state"
path = "release/a.txt"
contains = ["alpha"]

[[tasks.graders]]
type = "file-state"
path = "release/b.txt"
contains = ["beta"]

[[tasks]]
id = "permission_denial_has_no_side_effect"
fixture = "fixtures/tiny_project"
prompt = "Attempt the scripted destructive command, respect its denial, and stop."

[tasks.mock]
final_response = "The destructive command was denied; README.md remains intact."
[[tasks.mock.tool_turns]]
[[tasks.mock.tool_turns.calls]]
name = "bash"
arguments = '{"command":"rm -f README.md"}'

[[tasks.graders]]
type = "file-state"
path = "README.md"
exists = true
contains = ["Tiny Project"]

[[tasks]]
id = "mid_run_cancellation"
fixture = "fixtures/tiny_project"
prompt = "Wait for deterministic cancellation."
expected_status = "interrupted"
cancel_after_provider_attempts = 1

[tasks.mock]
final_response = ""
wait_for_cancellation = true

[[tasks]]
id = "resume_after_interruption"
fixture = "fixtures/tiny_project"
prompt = "Resume this exact context after deterministic interruption."
cancel_after_provider_attempts = 1
resume_after_interruption = true

[tasks.mock]
final_response = "Resumed the interrupted turn without replaying its prompt."
wait_for_cancellation = true
expected_user_message_count = 1

[[tasks.graders]]
type = "assertion"
contains = ["Resumed the interrupted turn"]

[[tasks]]
id = "provider_truncation_recovers"
fixture = "fixtures/tiny_project"
prompt = "Recover after the provider truncates an empty response."

[tasks.mock]
final_response = "Recovered after provider truncation."
truncated_responses = 1

[[tasks.graders]]
type = "assertion"
contains = ["Recovered after provider truncation"]

[[tasks]]
id = "two_sessions_one_workspace"
fixture = "fixtures/tiny_project"
prompt = "Read README.md, pause for the peer, preserve its edit, and record the primary session result separately."
cancel_after_provider_attempts = 2
resume_after_interruption = true

[tasks.mock]
final_response = "Preserved the peer edit and recorded the primary session change."
expected_user_message_count = 1
final_request_contains = [
  "Other bonsai sessions in this project",
  "README.md",
  "changed after it was read",
]
wait_for_cancellation_after_tool_turns = 1
[[tasks.mock.tool_turns]]
[[tasks.mock.tool_turns.calls]]
name = "read"
arguments = '{"path":"README.md"}'
[[tasks.mock.tool_turns]]
[[tasks.mock.tool_turns.calls]]
name = "write"
arguments = '''{"path":"README.md","content":"primary session clobber\n"}'''
[[tasks.mock.tool_turns]]
[[tasks.mock.tool_turns.calls]]
name = "write"
arguments = '''{"path":"primary-session.txt","content":"primary session completed without overwriting peer work\n"}'''

[tasks.shared_workspace_peer]
prompt = "Update README.md from the peer session."
expected_primary_changed_files = ["primary-session.txt"]
expected_peer_changed_files = ["README.md"]

[tasks.shared_workspace_peer.mock]
final_response = "Peer session updated README.md."
[[tasks.shared_workspace_peer.mock.tool_turns]]
[[tasks.shared_workspace_peer.mock.tool_turns.calls]]
name = "read"
arguments = '{"path":"README.md"}'
[[tasks.shared_workspace_peer.mock.tool_turns]]
[[tasks.shared_workspace_peer.mock.tool_turns.calls]]
name = "write"
arguments = '''{"path":"README.md","content":"# Tiny Project\n\npeer session edit preserved\n"}'''

[[tasks.graders]]
type = "file-state"
path = "README.md"
contains = ["peer session edit preserved"]
not_contains = ["primary session clobber"]

[[tasks.graders]]
type = "file-state"
path = "primary-session.txt"
contains = ["without overwriting peer work"]

[[tasks.graders]]
type = "assertion"
contains = ["Preserved the peer edit"]

