name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI (stable)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Verify migrations are immutable
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
        else
          BASE_SHA="${{ github.event.before }}"
        fi
        bash scripts/check-migrations-immutable.sh --history "$BASE_SHA" HEAD
    - name: Test migration immutability guard
      run: bash scripts/test_check_migrations_immutable.sh
    - name: Check
      run: cargo check --locked --all-targets
    - name: Run tests
      run: cargo test --locked
