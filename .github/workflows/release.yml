name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test migration immutability guard
        run: bash scripts/test_check_migrations_immutable.sh
      - name: Verify released migrations are immutable
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "::notice::No previous release tag; skipping migration history check."
            exit 0
          fi
          bash scripts/check-migrations-immutable.sh --history "$PREVIOUS_TAG" HEAD
      - name: Set up Node.js for TypeScript acceptance
        uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Set up Python acceptance runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Go acceptance runtime
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: false
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test release manifest builder
        run: |
          rustc --edition 2024 -D warnings --test scripts/build-release-manifest.rs -o /tmp/build-release-manifest-tests
          /tmp/build-release-manifest-tests
      - name: Test RC soak evidence validator
        run: python3 scripts/test_check_rc_soak.py
      - name: Test Homebrew tap updater
        run: python3 scripts/test_update_homebrew_tap.py
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Run deterministic release-gating evals
        run: cargo run --locked -- eval --mode mock --suite eval/suites/release_gating.toml --baseline eval/baselines/release-v1.toml --fail-on-task-failure
      - name: Run deterministic language acceptance evals
        run: cargo run --locked -- eval --mode mock --suite eval/suites/language_acceptance.toml --baseline eval/baselines/release-v1.toml --fail-on-task-failure
      - name: Smoke install
        run: |
          cargo install --path . --locked --debug --force --root /tmp/bonsai-install-smoke
          /tmp/bonsai-install-smoke/bin/bonsai --version

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runs_on }}
    env:
      BONSAI_RELEASE_PUBLIC_KEY: ${{ vars.BONSAI_RELEASE_PUBLIC_KEY }}
      BONSAI_RELEASE_TAG: ${{ github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-22.04
            runner_class: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            include_completions: true
          - runs_on: ubuntu-22.04-arm
            runner_class: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            include_completions: false
          - runs_on: macos-15
            runner_class: macos-15
            target: aarch64-apple-darwin
            macos_deployment_target: "13.0"
            include_completions: false
          - runs_on: macos-15-intel
            runner_class: macos-15-intel
            target: x86_64-apple-darwin
            macos_deployment_target: "13.0"
            include_completions: false
    steps:
      - uses: actions/checkout@v7
      - name: Validate release verification key
        run: |
          test -n "${BONSAI_RELEASE_PUBLIC_KEY}"
          test "$(printf '%s' "${BONSAI_RELEASE_PUBLIC_KEY}" | openssl base64 -d -A | wc -c | tr -d ' ')" = "32"
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke release binary
        run: |
          target/${{ matrix.target }}/release/bonsai --version
      - name: Measure and compare release binary performance
        env:
          BONSAI_PERF_BINARY: target/${{ matrix.target }}/release/bonsai
          BONSAI_PERF_REPORT: dist/bonsai-${{ github.ref_name }}-${{ matrix.target }}.performance.json
          BONSAI_PERF_SAMPLES: "5"
          BONSAI_PERF_RUNNER_CLASS: ${{ matrix.runner_class }}
          PERFORMANCE_BASELINE: eval/baselines/performance/${{ matrix.target }}.json
        run: |
          mkdir -p dist
          if [ -f "$PERFORMANCE_BASELINE" ]; then
            export BONSAI_PERF_BASELINE="$PERFORMANCE_BASELINE"
          else
            echo "::notice::No reviewed ${{ matrix.target }} baseline yet; recording report-only evidence."
          fi
          cargo test --release --locked --target ${{ matrix.target }} \
            --test performance_baseline -- --ignored --nocapture --test-threads=1
          report_name="bonsai-${{ github.ref_name }}-${{ matrix.target }}.performance.json"
          (cd dist && shasum -a 256 "$report_name" > "$report_name.sha256")
      - name: Pack binary
        run: |
          release_name="bonsai-${{ github.ref_name }}-${{ matrix.target }}"
          out_dir="target/${{ matrix.target }}/release"
          mkdir -p dist
          tar -czf "dist/${release_name}.tar.gz" -C "${out_dir}" bonsai
          (cd dist && shasum -a 256 "${release_name}.tar.gz" > "${release_name}.tar.gz.sha256")
          shasum -a 256 "${out_dir}/bonsai" | cut -d ' ' -f 1 > "dist/${release_name}.tar.gz.binary-sha256"
          if [ "${{ matrix.include_completions }}" = "true" ]; then
            "${out_dir}/bonsai" completions bash > dist/bonsai.bash
            "${out_dir}/bonsai" completions zsh > dist/_bonsai
            "${out_dir}/bonsai" completions fish > dist/bonsai.fish
            (
              cd dist
              for completion in bonsai.bash _bonsai bonsai.fish; do
                shasum -a 256 "${completion}" > "${completion}.sha256"
              done
            )
          fi
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: bonsai-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.binary-sha256
            dist/*.performance.json
            dist/bonsai.bash
            dist/_bonsai
            dist/bonsai.fish
            !dist/*.txt

  sbom:
    name: Generate release SBOM
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          syft-version: v1.46.0
          # artifact-name, not output-file, determines the filename inside the
          # uploaded artifact — output-file only names it on the sbom job's
          # filesystem, which is gone by the time publish downloads it. These
          # must stay identical, and must match the paths the publish job
          # attests and uploads, or the SBOM arrives in dist/ under the wrong
          # name. Keep the bonsai- prefix so the download pattern matches.
          artifact-name: bonsai-${{ github.ref_name }}.spdx.json
          output-file: bonsai-${{ github.ref_name }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

  publish:
    name: Publish release
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bonsai-*
          merge-multiple: true
          path: dist
      - name: Prepare release assets
        run: |
          (cd dist && sort *.sha256 > SHA256SUMS)
          echo "SHA256SUMS:"
          cat dist/SHA256SUMS
          if ! command -v gh >/dev/null; then
            echo "GitHub CLI not available"
            exit 1
          fi
      - name: Build and sign release manifest
        env:
          BONSAI_RELEASE_PRIVATE_KEY: ${{ secrets.BONSAI_RELEASE_PRIVATE_KEY }}
          BONSAI_RELEASE_PUBLIC_KEY: ${{ vars.BONSAI_RELEASE_PUBLIC_KEY }}
        run: |
          test -n "${BONSAI_RELEASE_PRIVATE_KEY}"
          test -n "${BONSAI_RELEASE_PUBLIC_KEY}"
          umask 077
          private_key="${RUNNER_TEMP}/bonsai-release-key.pem"
          public_key="${RUNNER_TEMP}/bonsai-release-public.pem"
          signature="${RUNNER_TEMP}/release-manifest.sig"
          trap 'rm -f "${private_key}" "${public_key}" "${signature}"' EXIT
          printf '%s\n' "${BONSAI_RELEASE_PRIVATE_KEY}" > "${private_key}"
          openssl pkey -in "${private_key}" -pubout -out "${public_key}"
          derived_key="$(openssl pkey -in "${private_key}" -pubout -outform DER | tail -c 32 | openssl base64 -A)"
          test "${derived_key}" = "${BONSAI_RELEASE_PUBLIC_KEY}"
          rustc --edition 2024 -D warnings scripts/build-release-manifest.rs \
            -o "${RUNNER_TEMP}/build-release-manifest"
          "${RUNNER_TEMP}/build-release-manifest" \
            --tag "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --dist dist \
            --output dist/release-manifest.json
          openssl pkeyutl -sign -rawin \
            -inkey "${private_key}" \
            -in dist/release-manifest.json \
            -out "${signature}"
          openssl base64 -A -in "${signature}" > dist/release-manifest.json.sig
          printf '\n' >> dist/release-manifest.json.sig
          openssl pkeyutl -verify -rawin -pubin \
            -inkey "${public_key}" \
            -in dist/release-manifest.json \
            -sigfile "${signature}"
      # actions/attest treats subject-path as globs and silently ignores
      # entries that match nothing, so a missing asset surfaces only in the
      # single-file sbom-path check further down — after provenance has already
      # reported success. Assert the whole set up front, with a listing, so a
      # naming mismatch names itself instead of failing as "SBOM file not
      # found" three steps later.
      - name: Verify release assets present
        run: |
          ls -la dist
          missing=0
          for asset in \
            "dist/bonsai-${{ github.ref_name }}.spdx.json" \
            dist/SHA256SUMS \
            dist/release-manifest.json \
            dist/release-manifest.json.sig \
            dist/bonsai.bash \
            dist/_bonsai \
            dist/bonsai.fish; do
            if [ ! -f "$asset" ]; then
              echo "missing release asset: $asset"
              missing=1
            fi
          done
          test "$missing" -eq 0
      - name: Attest release provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/release-manifest.json.sig
            dist/*.performance.json
            dist/bonsai.bash
            dist/_bonsai
            dist/bonsai.fish
            dist/bonsai-${{ github.ref_name }}.spdx.json
      - name: Attest release SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/bonsai-${{ github.ref_name }}.spdx.json
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS \
            dist/release-manifest.json dist/release-manifest.json.sig \
            dist/*.performance.json \
            dist/bonsai.bash dist/_bonsai dist/bonsai.fish \
            "dist/bonsai-${{ github.ref_name }}.spdx.json" \
            --prerelease --generate-notes
      - name: Record Homebrew release metadata
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p homebrew-release-metadata
          printf '%s\n' "$TAG" > homebrew-release-metadata/tag
          printf '%s\n' "$RELEASE_SHA" > homebrew-release-metadata/sha
      - name: Upload Homebrew release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-release-metadata
          path: homebrew-release-metadata
          retention-days: 7
